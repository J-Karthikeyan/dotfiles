# Kitty configuration

# =============================================================================
# Font Configuration
# =============================================================================
font_family      JetBrains Mono
bold_font        JetBrainsMono-Bold
italic_font      JetBrainsMono-Italic
bold_italic_font JetBrainsMono-BoldItalic
font_size        16

# Disable auto-reload of this config (negative = off). A reload re-applies
# font_size and wipes the live ctrl/cmd +/- zoom. Reload manually: ctrl+shift+f5.
# Takes effect on a full kitty restart (Cmd+Q + reopen).
auto_reload_config -1

# Render Nerd Font icon glyphs from JetBrainsMono Nerd Font while keeping
# plain JetBrains Mono for regular text.
symbol_map U+23FB-U+23FE,U+2665,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 FiraCode Nerd Font

text_composition_strategy 1.0 0
macos_thicken_font        0

# Color Scheme (Kanagawa Dragon)
background            #181616
foreground            #c5c9c5
selection_background  #2D4F67
selection_foreground  #c5c9c5

cursor                #87a987
cursor_text_color     #181616
cursor_shape          block

window_padding_width      6 10
window_margin_width       0
hide_window_decorations   titlebar-only
enable_audio_bell         no
cursor_trail              3
cursor_trail_decay        0.1 0.4
inactive_text_alpha       0.85

# ANSI Colors (kanagawa-dragon)
color0  #0d0c0c
color1  #c4746e
color2  #8a9a7b
color3  #c4b28a
color4  #8ba4b0
color5  #8992a7
color6  #8ea4a2
color7  #c5c9c5

color8  #625e5a
color9  #e46876
color10 #87a987
color11 #e6c384
color12 #7E9CD8
color13 #957FB8
color14 #7AA89F
color15 #DCD7BA

# Window & Appearance
background_opacity         0.85
background_blur            5
dynamic_background_opacity yes
hide_window_decorations   titlebar-only
window_padding_width      0 8
macos_colorspace          displayp3

map opt+j send_text all \x1bj
map opt+l send_text all \x1bl
map opt+s send_text all \x1bs

enabled_layouts splits,stack

map shift+enter send_text all \x1b\r
map cmd+shift+o set_background_opacity 1.0
map cmd+shift+t set_background_opacity 0.85

map cmd+backspace send_text all \x15
map cmd+left      send_text all \x1bOH
map cmd+right     send_text all \x1bOF
map opt+backspace send_text all \x1b\x7f

# Macos Specifics
macos_option_as_alt       yes
macos_quit_when_last_window_closed yes
macos_titlebar_color      background
macos_window_resizable    yes

# Behavior
mouse_hide_wait           1.0
scrollback_lines          100000

# Title bar
macos_show_window_title_in none
