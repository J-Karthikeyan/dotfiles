set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix: Keep Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless navigation with vim-tmux-navigator (no prefix needed)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Window management
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Vim-style splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start from window index 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Mouse and performance
set -g mouse on
set -g escape-time 0
set -s extended-keys on
set -as terminal-features ',*:extkeys'
set -g focus-events on
setw -g aggressive-resize on
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-keys vi

# =============================================================================
# Kanagawa Dragon Theme
# Background: #181616, Foreground: #c5c9c5
# Violet: #957FB8, Blue: #7E9CD8, Green: #87a987
# Yellow: #c4b28a, Red: #c4746e, Teal: #8ea4a2
# Gray: #625e5a
# =============================================================================
set -g status-position bottom
set -g status-interval 1
set -g status on
set -g status-justify left

set -g popup-border-lines rounded
set -g popup-border-style 'fg=#625e5a'

set -g status-left-length 50
set -g status-right-length 150
set -g status-left '#[fg=#8ba4b0,bold]   #S #[fg=#3d3a3a]'
setw -g window-status-format '#[fg=#3d3a3a,bg=#0d0c0c] #[fg=#625e5a]#I#[fg=#625e5a]·#[fg=#5e6a70]#W  '
set -g status-right '#{?client_prefix,#[fg=#c4b28a] ●,}#[fg=#87a987] #(~/dotfiles/tmux/.config/tmux/git-branch.sh "#{pane_current_path}")   #[fg=#3d3a3a]· #[fg=#c4b28a]%H#[fg=#625e5a]:%M '

# setw -g window-status-current-format '#[fg=#8ea4a2,underscore] #W #[nounderscore]'

# Window status

# Windows
setw -g window-status-separator ''
# setw -g window-status-format '#[fg=#282727,bg=#0d0c0c] ● #[fg=#3d3a3a]#W '
# setw -g window-status-current-format '#[fg=#8ba4b0,bg=#181616] ● #[fg=#8ba4b0]#W '

setw -g window-status-format '#[fg=#3d3a3a,bg=#0d0c0c]  #[fg=#625e5a]#I#[fg=#3d3a3a]·#W  '
setw -g window-status-current-format '#[fg=#8ba4b0,bg=#181616]  #[fg=#c4b28a]#I#[fg=#625e5a]·#[fg=#8ba4b0,underscore,us=#87a987]#W#[nounderscore]  '

# Window list background
set -g window-status-style "bg=#0d0c0c"
set -g window-status-current-style "bg=#181616"
set -g status-style "bg=#0d0c0c,fg=#c5c9c5"
# Pane borders
set -g pane-border-lines single
set -g pane-border-style 'fg=#282727'
set -g pane-active-border-style 'fg=#957FB8'
set -g pane-border-status off

# Message style
set -g message-style 'bg=#2D4F67,fg=#c5c9c5'
set -g message-command-style 'bg=#2D4F67,fg=#c4b28a'

# Window bell
setw -g window-status-bell-style 'fg=#181616,bg=#c4746e,bold'

# --- Old JetBrains colors ---
# set -g status-style 'bg=#1c1c1e,fg=#BCBEC4'
# set -g status-left '#[fg=#C092FA] #[fg=#BCBEC4]#S  '
# set -g status-right '#{?client_prefix,#[fg=#E0CE70,bold]● ,}#[fg=#6B6F76]%H:%M '
# setw -g window-status-format '#[fg=#6B6F76,bg=#1c1c1e] #W '
# setw -g window-status-current-format '#[fg=#191A1C,bg=#C092FA,bold] #W '
# set -g pane-border-style 'fg=#2a2d33'
# set -g pane-active-border-style 'fg=#C092FA'
# set -g message-style 'bg=#25324D,fg=#BCBEC4'
# set -g message-command-style 'bg=#25324D,fg=#E0CE70'
# setw -g window-status-bell-style 'fg=#191A1C,bg=#F27481,bold'

# F12 nested session toggle
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#c5c9c5,bg=#181616" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setqc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%d%;m'

# Last window shortcut
bind-key a last-window

# Unbind defaults
unbind %
unbind '"'

# Resize panes
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# --- Floating popups ---
bind-key -n M-\\ popup -E -w 80% -h 80% -d "#{pane_current_path}" "TMUX_POPUP=1 $SHELL"
bind-key -n "M-g" popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind-key -n "M-f" run-shell "~/.config/tmux/tmux-sessionizer"
bind-key -n "M-t" popup -E -w 80% -h 80% "btop"
bind-key -n "M-d" popup -E -w 80% -h 80% -d "#{pane_current_path}" "~/.config/tmux/tmux-file-picker"
bind-key -n "M-c" popup -E -w 80% -h 80% -d "#{pane_current_path}" "nvim /tmp/scratch.md"
bind-key -n "M-b" popup -E -w 80% -h 80% -d "#{pane_current_path}" "TMUX_POPUP=1 $SHELL"

# --- Quick actions ---
bind-key -n M-z resize-pane -Z
bind-key -n M-k kill-pane
bind-key -n M-r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind-key -n M-w choose-tree -Zw -O name

# --- Window navigation (opt + 1-9) ---
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- Window cycling (opt + [ / ]) ---
bind-key -n M-[ previous-window
bind-key -n M-] next-window

# --- Session cycling (opt + shift + [ / ]) ---
bind-key -n M-'{' switch-client -p
bind-key -n M-'}' switch-client -n

# --- Prefix bindings ---
bind-key z resize-pane -Z
bind-key S setw synchronize-panes
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#S" "rename-session '%%'"
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1
bind-key -r '{' swap-pane -U
bind-key -r '}' swap-pane -D
bind-key -r '|' swap-pane
bind-key m command-prompt -p "move pane to window:" "join-pane -t '%%'"
bind-key b break-pane
bind-key / copy-mode \; send-keys ?
bind-key M select-pane -m
bind-key J join-pane
bind-key t set-option status
bind-key X kill-window
bind-key Q kill-pane
bind-key L command-prompt -p "link window from [session]:window" "link-window -s '%%' -a"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# COPY MODE IMPROVEMENTS

bind-key [ copy-mode

# Use vim keys in copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Escape' send -X cancel
bind-key -T copy-mode-vi 'H' send -X start-of-line
bind-key -T copy-mode-vi 'L' send -X end-of-line

# Search and jump (like / in vim)
bind-key -T copy-mode-vi '/' command-prompt -i -p "search down:" "send -X search-forward-incremental '%%'"
bind-key -T copy-mode-vi '?' command-prompt -i -p "search up:" "send -X search-backward-incremental '%%'"

# SESSION MANAGEMENT
# Better session switcher with preview
bind-key -n M-s choose-tree -Zs -O name
bind-key -n M-n command-prompt -p "New session name:" "new-session -A -s '%%'"
bind-key -n M-a switch-client -l

# Quick project session - prompts for path
bind-key -n M-p command-prompt -p "Project path:" "new-session -A -s '%%' -c '%%'"

# History
set -g history-limit 50000
